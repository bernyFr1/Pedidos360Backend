spring.application.name=ms-pedidos-360-admin-mq
server.port=${SERVER_PORT:8086}

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:pedidos360}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:pedidos360}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/8dd4fb88-ff26-4101-a3ff-9c3b46315bd3/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=0ab8451e-f1ac-4ca0-995c-5557ce2e3893

# RabbitMQ Management API (monitoreo y administración de DLQ)
app.rabbitmq.management.url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672/api}
app.rabbitmq.management.username=${RABBITMQ_DEFAULT_USER:pedidos360}
app.rabbitmq.management.password=${RABBITMQ_DEFAULT_PASS:pedidos360}
app.rabbitmq.management.vhost=${RABBITMQ_VHOST:/}

# Colas clave expuestas en el dashboard
app.rabbitmq.monitoring.queues=${RABBITMQ_MONITOR_QUEUES:q.cmd.email,q.cmd.kitchen,q.cmd.invoice}
app.rabbitmq.monitoring.dlq-queues=${RABBITMQ_MONITOR_DLQ_QUEUES:q.cmd.email.dlq,q.cmd.kitchen.dlq,q.cmd.invoice.dlq}
app.rabbitmq.monitoring.dlq-limit=${RABBITMQ_MONITOR_DLQ_LIMIT:20}
app.rabbitmq.monitoring.requeue-search-limit=${RABBITMQ_MONITOR_REQUEUE_SEARCH_LIMIT:50}
