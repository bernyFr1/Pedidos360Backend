name: pedidos360-rabbitmq

services:
  rabbitmq-1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-1
    container_name: pedidos360-rabbitmq-1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-dev-cookie-change-me}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pedidos360}
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
    networks:
      - pedidos360-rabbitmq-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq-2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-2
    container_name: pedidos360-rabbitmq-2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-dev-cookie-change-me}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pedidos360}
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
    networks:
      - pedidos360-rabbitmq-net
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq-cluster-init:
    image: rabbitmq:3.13-management
    container_name: pedidos360-rabbitmq-init
    hostname: rabbitmq-init
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-dev-cookie-change-me}
      HOME: /tmp
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    networks:
      - pedidos360-rabbitmq-net
    volumes:
      - ./join-cluster.sh:/scripts/join-cluster.sh:ro,z
    entrypoint: ["/bin/sh", "/scripts/join-cluster.sh"]
    restart: "no"

networks:
  pedidos360-rabbitmq-net:
    name: pedidos360-rabbitmq-net

volumes:
  rabbitmq-1-data:
  rabbitmq-2-data: