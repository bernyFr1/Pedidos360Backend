spring.application.name=ms-pedidos-360-catalog
server.port=8081

spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@gcn5ldacwb15oubf_tp}
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_TNS_ADMIN:/opt/pedidos360/wallet}
spring.datasource.hikari.data-source-properties.oracle.net.wallet_location=${ORACLE_WALLET_LOCATION:(SOURCE=(METHOD=FILE)(METHOD_DATA=(DIRECTORY=/opt/pedidos360/wallet)))}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Configuración JWT (Microsoft Entra ID)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/8dd4fb88-ff26-4101-a3ff-9c3b46315bd3/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=0ab8451e-f1ac-4ca0-995c-5557ce2e3893

# Kafka - productor de inventario
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
app.kafka.topic.inventario=${KAFKA_TOPIC_INVENTARIO:inventario-eventos}

# Observabilidad (Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
